name: Backplane desktop package

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      arch:
        required: true
        type: string
      runner:
        required: true
        type: string
      target:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=8192
  BACKPLANE_DESKTOP_UPDATE_REPOSITORY: i2cjak/Backplane

jobs:
  package:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libsecret-1-dev pkg-config xvfb xauth
      - uses: actions/download-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: wsl-node-pty
          path: wsl-prebuild
      - uses: actions/download-artifact@v4
        if: inputs.platform != 'linux'
        with:
          name: kicad-runtime-${{ inputs.platform }}-${{ inputs.arch }}
          path: native-runtime
      - name: Download verified KiCad runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/stage-kicad-runtime.mjs --platform ${{ inputs.platform }} --arch ${{ inputs.arch }}
      - name: Download verified Python runtime
        run: bash scripts/stage-python-runtime.sh --platform ${{ inputs.platform }} --arch ${{ inputs.arch }} --destination apps/desktop/prod-resources/python-runtime
      - name: Build full desktop installer
        env:
          BACKPLANE_KICAD_RUNTIME: apps/desktop/prod-resources/kicad-runtime
          BACKPLANE_REQUIRE_BUNDLED_KICAD: "1"
          BACKPLANE_PYTHON_RUNTIME: apps/desktop/prod-resources/python-runtime
          BACKPLANE_REQUIRE_BUNDLED_PYTHON: "1"
          USE_HARD_LINKS: "true"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          NIGHTLY_VERSION: ${{ inputs.version }}
        run: |
          args=(--platform '${{ inputs.platform }}' --arch '${{ inputs.arch }}' --target '${{ inputs.target }}' --build-version "$NIGHTLY_VERSION")
          if [[ '${{ inputs.platform }}' == win ]]; then args+=(--wsl-prebuild "$GITHUB_WORKSPACE/wsl-prebuild/pty.node"); fi
          vp run dist:desktop:artifact "${args[@]}"
      - name: Verify packaged runtimes
        run: |
          case '${{ inputs.platform }}' in
            linux) artifacts=(release/*.AppImage); prefix=(xvfb-run --auto-servernum);;
            mac) artifacts=(release/*.zip); prefix=();;
            win) artifacts=(release/*.exe); prefix=();;
          esac
          test "${#artifacts[@]}" = 1
          "${prefix[@]}" node scripts/verify-nightly-desktop.mjs --platform '${{ inputs.platform }}' --arch '${{ inputs.arch }}' --artifact "${artifacts[0]}"
      - name: Verify and collect release assets
        run: node scripts/collect-nightly-assets.mjs --platform ${{ inputs.platform }} --arch ${{ inputs.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-desktop-${{ inputs.platform }}-${{ inputs.arch }}
          path: release-publish/*
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
