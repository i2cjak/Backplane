name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Release producer guards
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the service runtime, bootstrap and release asset guards
        run: |
          python3 test/tools/service_runtime_test.py
          python3 test/tools/release_bootstrap_test.py
          python3 test/tools/release_assets_test.py

  desktop-install:
    name: Linux desktop installer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 test/tools/desktop_install_test.py
      - name: Check test runner dispatch and failure guards
        run: python3 -m unittest discover -s test/tools -p test_runner_test.py

  check:
    name: Type-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bend
      - run: CHECK_JOBS=$(nproc) scripts/check.sh check

  proof:
    name: Prove laws
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bend
      # The proof reads only PROOF.bend's imports (scripts/bend-closure.py),
      # bend and the gate's scripts. When a run already proved exactly those
      # (any branch, any commit), its record is in the cache and the proof
      # is not run again; any change to them is another key, so it runs.
      - id: key
        run: |
          k=$(BP_KEY_ROOTS=PROOF.bend scripts/inputs-key.sh gate:proof scripts/check.sh scripts/bendok.sh scripts/bend-closure.py scripts/inputs-key.sh) || k=""
          echo "key=$k" >> "$GITHUB_OUTPUT"
          echo "proof inputs: ${k:-<none: the proof runs>}"
      - id: seen
        if: steps.key.outputs.key != ''
        uses: actions/cache/restore@v4
        with:
          path: .proof-ok
          key: proof-ok-${{ steps.key.outputs.key }}
          lookup-only: true
      - if: steps.seen.outputs.cache-hit == 'true'
        run: echo "PROOF.bend proved before on these exact inputs (proof-ok-${{ steps.key.outputs.key }})"
      - if: steps.seen.outputs.cache-hit != 'true'
        run: scripts/check.sh proof
      - if: steps.seen.outputs.cache-hit != 'true' && steps.key.outputs.key != ''
        run: echo "${{ steps.key.outputs.key }}" > .proof-ok
      - if: steps.seen.outputs.cache-hit != 'true' && steps.key.outputs.key != ''
        uses: actions/cache/save@v4
        with:
          path: .proof-ok
          key: proof-ok-${{ steps.key.outputs.key }}

  # Kept as the single gate other jobs depend on; it passes when both
  # halves above pass, so the check and the proof run in parallel on
  # separate runners instead of one after the other in one job.
  laws:
    name: Check and prove
    needs: [check, proof]
    runs-on: ubuntu-24.04
    steps:
      - run: echo "type-check and proof both passed"

  test:
    name: Tests ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      TEST_SHARD: ${{ matrix.shard }}
      TEST_SHARD_COUNT: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bend
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      # Real render-tree tests can use several GiB each. Keep two workers
      # per runner; the four shards still execute on separate machines.
      - run: TEST_JOBS=2 scripts/test.sh

  # The hub (docs/js-service.md): bend emits src/server/main.bend as JS
  # once (kept by a hash of what it reads, so a change that leaves the
  # server alone takes the last emit), `bun build --compile` cross-builds a
  # single-file backplane-serve for every target from it in seconds, and
  # the Linux one is tested here; js-native runs the others on their own
  # machines. There is no C build of the hub.
  js:
    name: JS service
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bend
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - id: key
        run: |
          k=$(scripts/build-js.sh --key src/server/main.bend) || k=""
          echo "key=$k" >> "$GITHUB_OUTPUT"
          echo "emit inputs: ${k:-<none: emitted fresh>}"
      # the folder and key scripts/build-js.sh keeps its emit under
      # (BACKPLANE_EMIT_CACHE's default; the file is <key>.js and .js.ok)
      - if: steps.key.outputs.key != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/backplane-bend/emit-js
          key: emit-js-${{ steps.key.outputs.key }}
      - name: Build backplane-serve for every target
        env:
          # nothing is published here: no Google client, no telemetry
          BACKPLANE_GOOGLE_BAKE: "0"
          BACKPLANE_TELEMETRY_BAKE: "0"
        run: |
          for t in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            BACKPLANE_JS_TARGET=$t scripts/build-js.sh src/server/main.bend dist-js/$t/backplane-serve
          done
          ls -l dist-js/*/
          # the notices every one ships with, Bun's pinned to its version
          BACKPLANE_LICENSES_STRICT=1 scripts/js-licenses.sh dist-js/licenses
      # the web client the hub serves (test/smoke.ts loads its page)
      - name: Web client
        run: bend src/web/index.html -o build/web > /dev/null
      - run: scripts/js-smoke.sh dist-js/linux-x64/backplane-serve build/web
      - name: Bake and release producer
        run: |
          bun test/tools/js_bake_test.ts
          python3 test/tools/service_release_test.py
      # the whole of test/smoke.ts (threads, agents), as scripts/smoke.sh
      # runs it
      - name: Full smoke
        run: |
          bend test/wire/index.html -o build/wire > /dev/null
          BACKPLANE_SMOKE_FULL=1 scripts/js-smoke.sh dist-js/linux-x64/backplane-serve build/web
      - uses: actions/upload-artifact@v4
        with:
          name: backplane-serve-js
          path: dist-js/
          retention-days: 7
          compression-level: 6

  js-native:
    name: JS service on ${{ matrix.target }}
    needs: js
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-arm64,  os: ubuntu-24.04-arm, gate: true }
          - { target: darwin-arm64, os: macos-15,         gate: true }
          - { target: darwin-x64,   os: macos-15-intel,   gate: true }
          # serves once Bend's JS runtime has Win32 syscalls (fast-hub J4,
          # io_sys); until then it only reports
          - { target: windows-x64,  os: windows-2025,     gate: false }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.gate }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          name: backplane-serve-js
          path: dist-js
      - shell: bash
        run: |
          f=dist-js/${{ matrix.target }}/backplane-serve
          [ -f "$f" ] || f=$f.exe
          chmod +x "$f"
          scripts/js-smoke.sh "$f"
