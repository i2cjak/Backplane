name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read # scripts/emit-fetch.sh reads other runs' emits

jobs:
  windows:
    name: Windows producer guards
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Windows resource and request guards
        run: |
          python3 -m unittest discover -s test/tools -p windows_service_test.py
          python3 -m unittest discover -s test/tools -p windows_release_request_test.py

  desktop-install:
    name: Linux desktop installer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 test/tools/desktop_install_test.py
      - name: Check test runner dispatch and failure guards
        run: python3 -m unittest discover -s test/tools -p test_runner_test.py

  check:
    name: Type-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check emit artifact producer trust
        run: python3 test/tools/emit_fetch_test.py
      - uses: ./.github/actions/setup-bend
      - run: CHECK_JOBS=$(nproc) scripts/check.sh check

  proof:
    name: Prove laws
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bend
      # The proof reads only PROOF.bend's imports (scripts/bend-closure.py),
      # bend and the gate's scripts. When a run already proved exactly those
      # (any branch, any commit), its record is in the cache and the proof
      # is not run again; any change to them is another key, so it runs.
      - id: key
        run: |
          k=$(BP_KEY_ROOTS=PROOF.bend scripts/inputs-key.sh gate:proof scripts/check.sh scripts/bendok.sh scripts/bend-closure.py scripts/inputs-key.sh) || k=""
          echo "key=$k" >> "$GITHUB_OUTPUT"
          echo "proof inputs: ${k:-<none: the proof runs>}"
      - id: seen
        if: steps.key.outputs.key != ''
        uses: actions/cache/restore@v4
        with:
          path: .proof-ok
          key: proof-ok-${{ steps.key.outputs.key }}
          lookup-only: true
      - if: steps.seen.outputs.cache-hit == 'true'
        run: echo "PROOF.bend proved before on these exact inputs (proof-ok-${{ steps.key.outputs.key }})"
      - if: steps.seen.outputs.cache-hit != 'true'
        run: scripts/check.sh proof
      - if: steps.seen.outputs.cache-hit != 'true' && steps.key.outputs.key != ''
        run: echo "${{ steps.key.outputs.key }}" > .proof-ok
      - if: steps.seen.outputs.cache-hit != 'true' && steps.key.outputs.key != ''
        uses: actions/cache/save@v4
        with:
          path: .proof-ok
          key: proof-ok-${{ steps.key.outputs.key }}

  # Kept as the single gate other jobs depend on; it passes when both
  # halves above pass, so the check and the proof run in parallel on
  # separate runners instead of one after the other in one job.
  laws:
    name: Check and prove
    needs: [check, proof]
    runs-on: ubuntu-24.04
    steps:
      - run: echo "type-check and proof both passed"

  test:
    name: Tests ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      TEST_SHARD: ${{ matrix.shard }}
      TEST_SHARD_COUNT: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bend
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      # Real render-tree tests can use several GiB each. Keep two workers
      # per runner; the four shards still execute on separate machines.
      - run: TEST_JOBS=2 scripts/test.sh

  # The JS service (docs/js-service.md): bend emits src/server/main.bend
  # as JS once (kept by a hash of what it reads, so a change that leaves the
  # server alone takes the last emit), `bun build --compile` cross-builds a
  # single-file backplane-serve for every target from it in seconds, and
  # the Linux one is smoke-tested here; js-native runs the others on their
  # own machines.
  js:
    name: JS service
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bend
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - id: key
        run: |
          k=$(scripts/build-js.sh --key src/server/main.bend) || k=""
          echo "key=$k" >> "$GITHUB_OUTPUT"
          echo "emit inputs: ${k:-<none: emitted fresh>}"
      # the folder and key scripts/build-js.sh keeps its emit under
      # (BACKPLANE_EMIT_CACHE's default; the file is <key>.js and .js.ok)
      - if: steps.key.outputs.key != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/backplane-bend/emit-js
          key: emit-js-${{ steps.key.outputs.key }}
      - name: Build backplane-serve for every target
        env:
          # nothing is published here: no Google client, no telemetry
          BACKPLANE_GOOGLE_BAKE: "0"
          BACKPLANE_TELEMETRY_BAKE: "0"
        run: |
          for t in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            BACKPLANE_JS_TARGET=$t scripts/build-js.sh src/server/main.bend dist-js/$t/backplane-serve
          done
          ls -l dist-js/*/
          # the notices every one ships with, Bun's pinned to its version
          BACKPLANE_LICENSES_STRICT=1 scripts/js-licenses.sh dist-js/licenses
      # the web client the hub serves (test/smoke.ts loads its page)
      - name: Web client
        run: bend src/web/index.html -o build/web > /dev/null
      - run: scripts/js-smoke.sh dist-js/linux-x64/backplane-serve build/web
      - name: Bake and release producer
        run: |
          bun test/tools/js_bake_test.ts
          python3 test/tools/service_release_test.py
      # the whole of test/smoke.ts (threads, agents) as scripts/smoke.sh runs
      # it for C, over the JS processes (fast-hub J1)
      - name: Full smoke
        run: |
          bend test/wire/index.html -o build/wire > /dev/null
          BACKPLANE_SMOKE_FULL=1 scripts/js-smoke.sh dist-js/linux-x64/backplane-serve build/web
      - uses: actions/upload-artifact@v4
        with:
          name: backplane-serve-js
          path: dist-js/
          retention-days: 7
          compression-level: 6

  js-native:
    name: JS service on ${{ matrix.target }}
    needs: js
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-arm64,  os: ubuntu-24.04-arm, gate: true }
          - { target: darwin-arm64, os: macos-15,         gate: true }
          - { target: darwin-x64,   os: macos-15-intel,   gate: true }
          # Bend's JS runtime has no Win32 syscalls yet (fast-hub: Windows
          # io_sys): the binary builds but cannot serve, so this only reports
          - { target: windows-x64,  os: windows-2025,     gate: false }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.gate }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          name: backplane-serve-js
          path: dist-js
      - shell: bash
        run: |
          f=dist-js/${{ matrix.target }}/backplane-serve
          [ -f "$f" ] || f=$f.exe
          chmod +x "$f"
          scripts/js-smoke.sh "$f"

  build:
    name: Build ${{ matrix.target }}
    # runs beside "laws" (which checks every file); nothing is published here
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64,    os: ubuntu-24.04 }
          - { target: linux-arm64,  os: ubuntu-24.04-arm }
          # macOS is on hold; scripts/build.sh builds it as hub + web server
          # - { target: darwin-arm64, os: macos-15 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bend
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Swap for the compile
        # bend's emit of the app takes 16-22 GB; the Linux runners have 16, so
        # without swap it can be killed. (The clang compiles no longer need
        # it: scripts/build-app.sh cuts the C into 16 units of about 2.5 GB.)
        if: runner.os == 'Linux'
        # the swap file goes on /mnt when the runner has it, and never takes
        # more than the free space less 8 GB (a full disk kills the runner)
        run: |
          dir=/; [ -d /mnt ] && dir=/mnt
          df -h / /mnt || true
          free_gb=$(df -BG --output=avail "$dir" | tail -1 | tr -dc 0-9)
          size=$(( free_gb - 8 )); [ "$size" -gt 16 ] && size=16
          if [ "$size" -ge 2 ]; then
            sudo fallocate -l "${size}G" "$dir/swap-build"
            sudo chmod 600 "$dir/swap-build"
            sudo mkswap "$dir/swap-build"
            sudo swapon "$dir/swap-build"
          else
            echo "only ${free_gb} GB free on $dir: no swap"
          fi
          free -h
      - name: Install clang 19
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 libx11-dev
          sudo ln -sf /usr/bin/clang-19 /usr/local/bin/clang
      - name: Object cache
        # the compiled C units, by hash of their text (scripts/cc-unit.sh): an
        # unchanged unit is not compiled again. Never holds the Google client
        # (a unit that includes it is not cached).
        uses: actions/cache@v4
        with:
          path: ~/.cache/backplane-bend/obj
          key: objs-${{ matrix.target }}-${{ github.sha }}
          restore-keys: objs-${{ matrix.target }}-
      - run: clang --version
      - name: Check pinned native emitter and ID boundaries
        run: python3 test/tools/native_compiler_test.py
      - run: scripts/build.sh
        env:
          BACKPLANE_SKIP_CHECK: "1" # the laws job checks every file
          BACKPLANE_JOBS: "2" # leave memory headroom for the larger native units
          # an emit of these exact inputs that another run made is fetched
          # instead of made again (scripts/emit-fetch.sh)
          GH_TOKEN: ${{ github.token }}
      # this run's own emit, for any later build of the same inputs (another
      # run, deploy_main, a release): scripts/emit-fetch.sh takes it by key
      - id: emit
        run: |
          f=build/cc/backplane-serve/emit.key
          if [ -f "$f" ] && [ "$(cut -d' ' -f2 "$f")" = fresh ]; then
            k=$(cut -d' ' -f1 "$f")
            mkdir -p build/emit-share
            cp "$HOME/.cache/backplane-bend/emit/$k.c" "$HOME/.cache/backplane-bend/emit/$k.ok" build/emit-share/
            echo "key=$k" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.emit.outputs.key != '' && matrix.target == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: emit-${{ steps.emit.outputs.key }}
          path: build/emit-share/
          retention-days: 14
          compression-level: 6
      - run: scripts/smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: backplane-${{ matrix.target }}
          path: dist/
          retention-days: 7
