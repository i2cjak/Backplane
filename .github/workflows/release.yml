name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, e.g. v0.2.0
        required: true
  # nightly.yml builds and publishes its prerelease through these same jobs
  workflow_call:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  laws:
    name: Check and prove
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: ./.github/actions/setup-bend
      - run: scripts/check.sh

  build:
    name: Build ${{ matrix.target }}
    needs: [laws]
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: linux-x64,    os: ubuntu-24.04 }
          - { target: linux-arm64,  os: ubuntu-24.04-arm }
          # darwin-arm64 is the two jobs below
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: ./.github/actions/setup-bend
      - uses: oven-sh/setup-bun@v2
      - name: Swap for the compile
        # clang takes about 20 GB to compile the app's C (one large file);
        # the Linux runners have 16, so without swap the compile can be killed
        if: runner.os == 'Linux'
        # the swap file goes on /mnt when the runner has it, and never takes
        # more than the free space less 8 GB (a full disk kills the runner)
        run: |
          dir=/; [ -d /mnt ] && dir=/mnt
          df -h / /mnt || true
          free_gb=$(df -BG --output=avail "$dir" | tail -1 | tr -dc 0-9)
          size=$(( free_gb - 8 )); [ "$size" -gt 16 ] && size=16
          if [ "$size" -ge 2 ]; then
            sudo fallocate -l "${size}G" "$dir/swap-build"
            sudo chmod 600 "$dir/swap-build"
            sudo mkswap "$dir/swap-build"
            sudo swapon "$dir/swap-build"
          else
            echo "only ${free_gb} GB free on $dir: no swap"
          fi
          free -h
      - name: Install clang 19 and X11 headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 libx11-dev
          sudo ln -sf /usr/bin/clang-19 /usr/local/bin/clang
      - run: BACKPLANE_VERSION="$TAG" scripts/build.sh
        env:
          # the Google client "Connect Google" signs in with (scripts/build-app.sh)
          BACKPLANE_GOOGLE_CLIENT_ID: ${{ secrets.BACKPLANE_GOOGLE_CLIENT_ID }}
          BACKPLANE_GOOGLE_CLIENT_SECRET: ${{ secrets.BACKPLANE_GOOGLE_CLIENT_SECRET }}
      - run: scripts/smoke.sh
      - run: scripts/package.sh "$TAG" "${{ matrix.target }}"
      - run: scripts/package-linux.sh "$TAG" "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: backplane-${{ matrix.target }}
          path: |
            dist/backplane-*.tar.gz
            dist/backplane-*.AppImage
            dist/backplane_*.deb

  # macOS: the hub and web UI as `backplane` (no X11, so no window). bend's
  # emit of the server takes over 8 GB, which a macOS runner (7 GB) spends
  # hours swapping through, and its C is the same on every platform: a
  # Linux runner emits it with the web client, the Mac compiles it.
  emit-darwin:
    name: Emit darwin-arm64
    needs: [laws]
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: ./.github/actions/setup-bend
      - run: BACKPLANE_VERSION="$TAG" scripts/build.sh emit
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64-emitted
          retention-days: 1
          path: |
            dist/web
            build/cc/backplane-serve/all.c
            build/wire

  build-darwin:
    name: Build darwin-arm64
    needs: [emit-darwin]
    runs-on: macos-15
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      BACKPLANE_PREBUILT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: ./.github/actions/setup-bend
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          name: darwin-arm64-emitted
          path: .
      - run: clang --version
      - run: BACKPLANE_VERSION="$TAG" scripts/build.sh
        env:
          BACKPLANE_GOOGLE_CLIENT_ID: ${{ secrets.BACKPLANE_GOOGLE_CLIENT_ID }}
          BACKPLANE_GOOGLE_CLIENT_SECRET: ${{ secrets.BACKPLANE_GOOGLE_CLIENT_SECRET }}
      - run: scripts/smoke.sh
      - run: scripts/package.sh "$TAG" darwin-arm64
      # Backplane.app: the same hub in a window of its own (mac/Backplane)
      - run: scripts/package-mac.sh "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: backplane-darwin-arm64
          path: |
            dist/backplane-*.tar.gz
            dist/backplane-*.app.zip

  android:
    name: Build Android
    needs: [laws]
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: ./.github/actions/setup-bend
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # the runner's Android SDK ($ANDROID_HOME); signed with the debug key
      # until a release key exists (mobile/android/app/build.gradle.kts)
      - run: scripts/build-mobile.sh
      - run: mv dist/backplane-android.apk "dist/backplane-$TAG-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: backplane-android
          path: dist/backplane-*-android.apk

  publish:
    name: Publish
    needs: [build, build-darwin, android]
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: backplane-*
          merge-multiple: true
      - name: Checksums and installer
        run: |
          set -eu
          cd out
          sha256sum backplane-*.tar.gz backplane-*.app.zip backplane-*.AppImage backplane_*.deb backplane-*.apk > SHA256SUMS
          cat SHA256SUMS
          sum() { grep "backplane-$TAG-$1.tar.gz" SHA256SUMS | cut -d' ' -f1; }
          sed -e "s/@VERSION@/$TAG/" \
              -e "s/@SHA_LINUX_X64@/$(sum linux-x64)/" \
              -e "s/@SHA_LINUX_ARM64@/$(sum linux-arm64)/" \
              -e "s/@SHA_DARWIN_ARM64@/$(sum darwin-arm64)/" \
              ../deploy/install.sh.in > install.sh
          chmod +x install.sh
          # the AUR's PKGBUILD follows full releases only
          case "$TAG" in
            *-*) ;;
            *) sed -e "s/@PKGVER@/${TAG#v}/" \
                   -e "s/@SHA_LINUX_X64@/$(sum linux-x64)/" \
                   -e "s/@SHA_LINUX_ARM64@/$(sum linux-arm64)/" \
                   ../deploy/aur/PKGBUILD.in > PKGBUILD ;;
          esac
      - name: Release
        run: |
          set -eu
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          # each release's installer installs that release (latest/ never
          # names a prerelease, so a nightly's must be its own)
          notes="Linux (x64, arm64) and macOS (Apple silicon). On a Mac, Backplane.app (backplane-$TAG-darwin-arm64.app.zip) opens it in a window; it is not notarized yet, so the first time open it from System Settings > Privacy & Security > Open Anyway.

          Install: \`curl -fsSL https://github.com/${{ github.repository }}/releases/download/$TAG/install.sh | sh\`"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --title "Backplane $TAG" --notes "$notes" $pre
          fi
