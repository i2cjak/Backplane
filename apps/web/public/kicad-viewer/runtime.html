<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Backplane KiCad viewer</title>
    <style>
      html,
      body,
      #viewer {
        height: 100%;
        width: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        background: #101214;
        color: #b8b8b8;
        font:
          12px "Berkeley Mono",
          ui-monospace,
          monospace;
      }
      #error {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        pointer-events: none;
      }
      #error:empty {
        display: none;
      }
      #error.refresh-status {
        inset: auto auto 12px 12px;
        max-width: min(420px, calc(100% - 48px));
        background: #101214e8;
        border: 1px solid #ffffff30;
        padding: 8px 12px;
        z-index: 30;
      }
      .model-layers {
        position: absolute;
        top: 12px;
        right: 12px;
        border: 1px solid #ffffff30;
        padding: 10px;
        background: #101214ed;
        color: #ddd;
      }
      .model-layers summary {
        cursor: pointer;
      }
      .model-layers label {
        display: flex;
        gap: 8px;
        align-items: center;
        padding-top: 10px;
      }
      .step-selection-panel {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 20;
        display: flex;
        flex-direction: column;
        width: min(290px, calc(100% - 24px));
        max-height: min(72vh, 560px);
        box-sizing: border-box;
        border: 1px solid #ffffff30;
        background: #101214ed;
        color: #dce5e0;
        font-size: 14px;
      }
      .step-selection-tree {
        overflow: auto;
        padding: 4px;
      }
      .step-selection-toggle {
        display: none;
        width: 100%;
        min-height: 34px;
        border: 0;
        border-bottom: 1px solid #ffffff24;
        border-radius: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .step-selection-group > summary,
      .step-selection-item {
        display: block;
        box-sizing: border-box;
        width: 100%;
        min-height: 30px;
        padding: 6px 8px;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        line-height: 1.25;
        text-align: left;
        cursor: pointer;
        list-style-position: inside;
      }
      .step-selection-group > summary {
        display: list-item;
        padding-left: calc(8px + var(--step-depth, 0) * 14px);
        overflow-wrap: anywhere;
      }
      .step-selection-item {
        padding-left: calc(24px + var(--step-depth, 0) * 14px);
        overflow-wrap: anywhere;
      }
      .step-selection-tree {
        scrollbar-width: thin;
        scrollbar-color: #4b6254 #141a17;
        overflow-x: hidden;
      }
      .step-selection-group > summary:hover,
      .step-selection-item:hover,
      .step-selection-group > summary[aria-selected="true"],
      .step-selection-item[aria-selected="true"] {
        background: #b8f3c426;
        color: #d8ffe0;
      }
      .step-selection-controls {
        display: grid;
        gap: 7px;
        border-top: 1px solid #ffffff24;
        padding: 10px;
      }
      .step-selection-controls[hidden] {
        display: none;
      }
      .step-selection-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        overflow: hidden;
      }
      .step-selection-heading span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .step-selection-heading output {
        color: #b8f3c4;
        font-variant-numeric: tabular-nums;
      }
      .step-selection-controls input {
        width: 100%;
        accent-color: #b8f3c4;
      }
      .step-selection-actions {
        display: flex;
        gap: 6px;
      }
      .step-selection-actions button {
        min-height: 26px;
        border: 1px solid #ffffff30;
        border-radius: 0;
        background: #ffffff0b;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .step-selection-actions button:hover {
        background: #b8f3c426;
      }
      .step-selection-panel.is-collapsed .step-selection-tree,
      .step-selection-panel.is-collapsed .step-selection-controls {
        display: none;
      }
      [data-color-scheme="light"] .step-selection-panel {
        border-color: #18202326;
        background: #f8faf9ed;
        color: #283830;
      }
      [data-color-scheme="light"] .step-selection-group > summary:hover,
      [data-color-scheme="light"] .step-selection-item:hover,
      [data-color-scheme="light"] .step-selection-group > summary[aria-selected="true"],
      [data-color-scheme="light"] .step-selection-item[aria-selected="true"] {
        background: #2e724126;
        color: #1f542e;
      }
      @media (max-width: 640px) {
        .step-selection-panel {
          top: 8px;
          left: 8px;
          width: min(270px, calc(100% - 16px));
          max-height: 58vh;
        }
        .step-selection-toggle {
          display: block;
          padding: 6px 10px;
        }
      }
      .canvas-actions {
        position: absolute;
        bottom: 16px;
        right: 16px;
        display: flex;
        gap: 2px;
        border: 1px solid #ffffff20;
        border-radius: 0;
        padding: 4px;
        background: #182023;
        box-shadow: 0 4px 20px #0003;
        z-index: 20;
      }
      .schematic-hierarchy-panel {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 22;
        width: min(290px, calc(100% - 24px));
        max-height: min(72vh, 560px);
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        border: 1px solid #ffffff30;
        background: #101214ed;
        color: #dce5e0;
        font:
          14px/1.25 "Berkeley Mono",
          ui-monospace,
          monospace;
      }
      .schematic-hierarchy-status:empty {
        display: none;
      }
      .schematic-hierarchy-status {
        padding: 8px;
      }
      .schematic-hierarchy-heading {
        display: flex;
        align-items: stretch;
        border-bottom: 1px solid #ffffff24;
      }
      .schematic-hierarchy-toggle,
      .schematic-hierarchy-actions button,
      .schematic-hierarchy-disclosure,
      .schematic-hierarchy-item {
        min-height: 30px;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .schematic-hierarchy-toggle {
        flex: 1;
        padding: 7px 10px;
        text-align: left;
      }
      .schematic-hierarchy-actions {
        display: flex;
        gap: 2px;
        padding: 3px;
      }
      .schematic-hierarchy-actions button {
        padding: 2px 7px;
        border: 1px solid #ffffff30;
      }
      .schematic-hierarchy-actions button:hover,
      .schematic-hierarchy-toggle:hover,
      .schematic-hierarchy-row:hover,
      .schematic-hierarchy-row[aria-selected="true"] {
        background: #b8f3c426;
        color: #d8ffe0;
      }
      .schematic-hierarchy-actions button:disabled {
        cursor: default;
        opacity: 0.4;
      }
      .schematic-hierarchy-tree {
        min-height: 0;
        max-height: min(64vh, 510px);
        overflow: auto;
        padding: 4px;
        scrollbar-width: thin;
      }
      .schematic-hierarchy-row {
        display: flex;
        align-items: center;
        min-width: 0;
        padding-left: calc(var(--schematic-depth, 0) * 14px);
      }
      .schematic-hierarchy-disclosure {
        width: 24px;
        flex: 0 0 24px;
        padding: 0;
      }
      .schematic-hierarchy-disclosure-spacer {
        width: 24px;
        flex: 0 0 24px;
      }
      .schematic-hierarchy-item {
        flex: 1;
        min-width: 0;
        padding: 6px 8px;
        overflow: hidden;
        text-align: left;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .schematic-hierarchy-panel.is-collapsed .schematic-hierarchy-tree {
        display: none;
      }
      @media (max-width: 640px) {
        .schematic-hierarchy-panel {
          top: 62px;
          left: 8px;
          width: min(280px, calc(100% - 16px));
          max-height: 58vh;
        }
        .schematic-hierarchy-tree {
          max-height: 50vh;
        }
        .schematic-hierarchy-toggle,
        .schematic-hierarchy-actions button,
        .schematic-hierarchy-disclosure,
        .schematic-hierarchy-item {
          min-height: 42px;
        }
      }
      .canvas-actions button {
        border: 0;
        border-radius: 0;
        background: transparent;
        color: #dce5e0;
        height: 32px;
        min-width: 32px;
        padding: 0 10px;
        font: inherit;
        cursor: pointer;
        transition: background-color 140ms;
      }
      .canvas-actions button:hover {
        background: #ffffff14;
      }
      [data-color-scheme="light"] .canvas-actions {
        background: #f8faf9;
        border-color: #18202326;
      }
      [data-color-scheme="light"] .canvas-actions button {
        color: #283830;
      }
      [data-color-scheme="light"] .canvas-actions button:hover {
        background: #1820230c;
      }
      .canvas-actions button:focus-visible {
        outline: 2px solid #8fbe9a;
      }
      @media (max-width: 640px) {
        .canvas-actions {
          right: 10px;
          bottom: 10px;
        }
        .canvas-actions button {
          min-height: 40px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .canvas-actions button {
          transition: none;
        }
      }
      #viewer:has(ecad-viewer) .canvas-actions {
        top: 12px;
        bottom: auto;
      }
      ecad-viewer,
      ecad-3d-viewer {
        display: block;
        height: 100%;
        width: 100%;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "./three/three.module.js",
          "three/addons/": "./three/addons/",
          "3d-viewer": "./3d-viewer.js",
          "glyph-full": "./glyph-full.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="viewer"></div>
    <div id="error" role="status"></div>
    <script type="module" src="./runtime.js"></script>
  </body>
</html>
